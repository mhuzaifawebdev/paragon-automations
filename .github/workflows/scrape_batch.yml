name: Scrape uploaded batch

# Runs a team's uploaded batch (web_scraper/index.html -> api/start-batch.js commits the raw file
# to data_hei/uploads/<batch>.csv and fires the "scrape-start" event below) one CHUNK at a time -
# scraper2/batch_runner.py's --once flag was written specifically for this: one job = one chunk.
#
# Self-chaining: if rows remain after a chunk, the last step re-fires "scrape-start" for the same
# batch so the next chunk runs as a fresh job. This is not optional - GitHub Actions does not let
# the built-in GITHUB_TOKEN trigger new workflow runs (an anti-infinite-loop rule), so a real PAT
# (secrets.DISPATCH_TOKEN) is required to re-dispatch. Progress is committed after every chunk, so
# a timeout or cancellation never loses more than one chunk's work.
#
# Cancellation: web_scraper's "Cancel this batch" button (api/cancel-batch.js) writes
# data_hei/<batch>/CANCELLED. The first step below checks for that marker every run and, if
# present, marks progress.json "cancelled" and skips everything else - so a batch that was
# cancelled mid-run does at most one more chunk before stopping for good.

on:
  repository_dispatch:
    types: [scrape-start]
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch name (matches data_hei/<batch>/)"
        required: true
      provider:
        description: "gemini (free) | claude_api (paid) | rules (no AI)"
        default: "gemini"
      chunk_size:
        description: "Institutes per chunk"
        default: "25"

permissions:
  contents: write

concurrency:
  group: scrape-${{ github.event.client_payload.batch || github.event.inputs.batch }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BATCH: ${{ github.event.client_payload.batch || github.event.inputs.batch }}
      PROVIDER: ${{ github.event.client_payload.provider || github.event.inputs.provider || 'gemini' }}
      CHUNK_SIZE: ${{ github.event.client_payload.chunk_size || github.event.inputs.chunk_size || '25' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies (with retry - PyPI/network hiccups do happen)
        run: |
          success=false
          for i in 1 2 3; do
            if pip install -r requirements.txt; then success=true; break; fi
            echo "pip install failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done
          # Without this check, a loop that exhausts all 3 attempts still ends on `sleep` (always
          # exit 0), so the step would silently report success despite nothing being installed -
          # the real failure would only surface later and more confusingly, e.g. ModuleNotFoundError.
          if [ "$success" != "true" ]; then
            echo "::error::pip install failed after 3 attempts"
            exit 1
          fi

      - name: Check for a cancellation marker (web_scraper's "Cancel this batch" button)
        id: cancelcheck
        run: |
          if [ -f "data_hei/$BATCH/CANCELLED" ]; then
            echo "cancelled=true" >> "$GITHUB_OUTPUT"
            python -c "
          import json, datetime, os
          path = f'data_hei/$BATCH/progress.json'
          data = json.load(open(path)) if os.path.exists(path) else {'batch': '$BATCH', 'total_rows': 0, 'done': 0}
          data['status'] = 'cancelled'
          data['generated_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          json.dump(data, open(path, 'w'))
          "
            git config user.name "paragon-scraper-bot"
            git config user.email "actions@users.noreply.github.com"
            git add "data_hei/$BATCH"
            git diff --cached --quiet || git commit -m "scrape $BATCH: cancelled [automated]"
            git pull --rebase --autostash -q
            git push
          else
            echo "cancelled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the uploaded file, if not already imported
        if: steps.cancelcheck.outputs.cancelled != 'true'
        run: |
          if [ -f "data_hei/$BATCH/numbers_clean.csv" ]; then
            echo "Already imported, skipping."
          elif python scraper2/import_batch.py --csv "data_hei/uploads/$BATCH.csv" --batch "$BATCH"; then
            echo "Imported."
          else
            mkdir -p "data_hei/$BATCH"
            python -c "
          import json, datetime
          json.dump({
              'batch': '$BATCH', 'status': 'error',
              'error': 'Import failed - check the uploaded file columns (see scraper2/import_batch.py ALIASES).',
              'generated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'total_rows': 0, 'done': 0, 'pending': 0, 'chunk': 0, 'total_chunks': 0,
              'confidence': {'high': 0, 'medium': 0, 'low': 0, 'none': 0}, 'recent': [],
          }, open('data_hei/$BATCH/progress.json', 'w'))
          "
            git config user.name "paragon-scraper-bot"
            git config user.email "actions@users.noreply.github.com"
            git add "data_hei/$BATCH" "data_hei/uploads"
            git commit -m "scrape $BATCH: import failed [automated]"
            git pull --rebase --autostash -q
            git push
            exit 1
          fi

      - name: Write an initial progress checkpoint, so the page shows "running" immediately
        # Without this, progress.json is only written AFTER a whole chunk finishes - for a small
        # file (fewer rows than chunk-size), that means the page shows "not found" for the entire
        # first chunk, which for real websites + real LLM calls can genuinely take minutes and looks
        # exactly like nothing is happening. This gives it something true to show within seconds.
        if: steps.cancelcheck.outputs.cancelled != 'true'
        run: |
          if [ ! -f "data_hei/$BATCH/progress.json" ]; then
            python -c "
          import json, csv, datetime, math
          with open('data_hei/$BATCH/numbers_clean.csv', encoding='utf-8-sig') as f:
              total = sum(1 for _ in csv.DictReader(f))
          json.dump({
              'batch': '$BATCH', 'status': 'running',
              'generated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'total_rows': total, 'done': 0, 'pending': total,
              'chunk': 1, 'total_chunks': max(1, math.ceil(total / int('$CHUNK_SIZE'))),
              'confidence': {'high': 0, 'medium': 0, 'low': 0, 'none': 0}, 'recent': [],
          }, open('data_hei/$BATCH/progress.json', 'w'))
          "
            git config user.name "paragon-scraper-bot"
            git config user.email "actions@users.noreply.github.com"
            git add "data_hei/$BATCH"
            git commit -m "scrape $BATCH: started [automated]"
            git pull --rebase --autostash -q
            git push
          fi

      - name: Run one chunk, pushing real results while it's still running
        # batch_runner.py now updates progress.json AND institutions_enriched.csv (via
        # run_batch.merge()) after every row, not just once at chunk end - a chunk of real websites
        # + real LLM calls can take minutes. This backgrounds it and pushes the whole batch
        # directory every 20s, so a crash or timeout mid-chunk only loses the last <20s of work,
        # not the whole chunk - and the download button always reflects genuinely saved results,
        # not just a progress counter that's ahead of what's actually downloadable.
        if: steps.cancelcheck.outputs.cancelled != 'true'
        run: |
          git config user.name "paragon-scraper-bot"
          git config user.email "actions@users.noreply.github.com"

          PARAGON_DATA="data_hei/$BATCH" python scraper2/batch_runner.py \
            --batch "$BATCH" --chunk-size "$CHUNK_SIZE" --provider "$PROVIDER" --once &
          RUNNER_PID=$!

          while kill -0 $RUNNER_PID 2>/dev/null; do
            sleep 20
            if git add "data_hei/$BATCH" 2>/dev/null && ! git diff --cached --quiet; then
              git commit -m "scrape $BATCH: progress update [automated]" -q
              git pull --rebase --autostash -q || true
              git push -q || echo "(live progress push failed, non-fatal - the final commit after this chunk will still catch up)"
            fi
          done
          wait $RUNNER_PID

      - name: Commit this chunk's results
        if: steps.cancelcheck.outputs.cancelled != 'true'
        run: |
          git config user.name "paragon-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "data_hei/$BATCH" "data_hei/uploads"
          git diff --cached --quiet || git commit -m "scrape $BATCH: chunk done [automated]"
          git pull --rebase --autostash -q
          git push

      - name: Continue with the next chunk, or build the final Excel file if this batch is done
        if: steps.cancelcheck.outputs.cancelled != 'true'
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          PENDING=$(python -c "import json; print(json.load(open('data_hei/$BATCH/progress.json')).get('pending', 0))")
          echo "Pending rows: $PENDING"
          if [ "$PENDING" -gt 0 ]; then
            # curl -s alone treats ANY HTTP response (even 401/404/422) as a successful curl
            # invocation - it only fails on a transport-level error, never on the API rejecting the
            # request. That let a batch silently stop self-chaining while this very step still
            # reported green. -w appends the real HTTP status so we can actually check it.
            HTTP_STATUS=$(curl -s -o /tmp/dispatch_response.txt -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d "{\"event_type\":\"scrape-start\",\"client_payload\":{\"batch\":\"$BATCH\",\"provider\":\"$PROVIDER\",\"chunk_size\":\"$CHUNK_SIZE\"}}")
            echo "Dispatch HTTP status: $HTTP_STATUS"
            cat /tmp/dispatch_response.txt
            if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
              echo "::error::Failed to dispatch the next chunk for batch $BATCH (HTTP $HTTP_STATUS) - this batch will NOT continue on its own. Re-run manually via workflow_dispatch once fixed."
              exit 1
            fi
          else
            python scraper2/build_xlsx.py --batch "$BATCH"
            git config user.name "paragon-scraper-bot"
            git config user.email "actions@users.noreply.github.com"
            git add "data_hei/$BATCH/results.xlsx"
            git diff --cached --quiet || git commit -m "scrape $BATCH: built results.xlsx [automated]"
            git pull --rebase --autostash -q
            git push
            echo "Batch $BATCH complete."
          fi
