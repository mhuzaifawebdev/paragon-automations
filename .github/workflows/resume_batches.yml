name: Resume paused scraper batches

# A scraper batch pauses itself when the free AI allowance is used up (status "waiting" + resume_at in
# data_hei/<batch>/progress.json - see scraper2/batch_runner.py). Every 15 minutes this looks for paused batches
# whose time has come and starts them again with the same "scrape-start" event the upload page uses, so a long
# batch carries on over several days with nobody watching it.
#
# Needs secrets.DISPATCH_TOKEN (the same one scrape_batch.yml already uses to start its next chunk).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  # GitHub runs the schedule above far less often than asked (every 3-6 hours in practice), so a change to the
  # list of paid readers or to this job is also picked up straight away when it is pushed.
  push:
    branches: [main]
    paths:
      - .github/workflows/resume_batches.yml
      - scripts/resume_due_batches.py
      - scraper2/llm.py

permissions:
  contents: write

concurrency:
  group: resume-batches
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tell the upload page which paid readers have a key
        # The page offers "paid Gemini" / "Claude Haiku" for a paused batch, but only a job here can see which
        # keys exist. Names and rough prices only are written - never a key. Without this the page would not
        # learn about a newly added key until the batch next ran.
        env:
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/resume_due_batches.py --list-paid-readers

      - name: Start every paused batch that is due
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: python scripts/resume_due_batches.py

      - name: Save the new "look again at" times
        run: |
          git config user.name "paragon-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data_hei/*/progress.json data_hei/paid_readers.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "resume: paused batches / paid readers updated [automated]"
            git pull --rebase --autostash -q
            git push -q
          fi
