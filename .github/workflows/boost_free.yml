name: Free boost of contacts and emails

# Free (no AI, no paid search): every finished institute with a website but no email or no contact has its own home,
# contact, staff and legal pages read again with today's rules (any address on its own domain; a named person whose
# own address carries their name). Archived batches are read from Drive, updated and archived again, and the
# dashboard figures rebuilt. See scripts/boost_free.py. Safe to run again: institutes already boosted are skipped.
on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Only this batch (empty = all batches)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: boost-free

jobs:
  boost:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Read the sites again, committing every 10 archived batches
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          git config user.name "paragon-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          python scripts/boost_free.py --archived --workers 16 --commit-every 10 ${{ github.event.inputs.batch && format('--batch "{0}"', github.event.inputs.batch) || '' }}
          git add data_hei
          git diff --cached --quiet || git commit -q -m "free boost: contacts and emails added [automated]"
          git pull --rebase --autostash -q && git push -q
