name: Process finished calls

# Picks up anything the webhook Worker dropped in data/calls/inbox/, scores it,
# classifies it, updates campaign_state.csv, and commits the results back.
# Runs on a schedule (the reliable path) and also on push to inbox/ (for faster
# turnaround right after a call ends) - whichever fires first wins; both are safe
# to run even when the other already emptied the inbox.

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes - adjust once real call volume is known
  push:
    paths:
      - "data/calls/inbox/**.json"
  workflow_dispatch: {}       # manual trigger, e.g. for re-running after a fix

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          success=false
          for i in 1 2 3; do
            if pip install pyyaml lxml pypdf; then success=true; break; fi
            echo "pip install failed (attempt $i/3), retrying in 10s..."
            sleep 10
          done
          if [ "$success" != "true" ]; then
            echo "::error::pip install failed after 3 attempts"
            exit 1
          fi

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Process every file in the inbox
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent/process_call.py --all

      - name: Commit results
        run: |
          git config user.name "paragon-call-processor"
          git config user.email "actions@users.noreply.github.com"
          # Same class of bug already fixed in pause_monitor.yml and scrape_batch.yml: `git add` on
          # an explicitly-named path that doesn't exist yet fails hard ("pathspec did not match any
          # files"), unlike a glob or `git add .` - data/results and data/campaign_state.csv don't
          # exist until a real call has actually been processed, which hasn't happened yet.
          [ -e data/calls ] && git add data/calls
          [ -e data/results ] && git add data/results
          [ -f data/campaign_state.csv ] && git add data/campaign_state.csv
          git diff --cached --quiet || git commit -m "Process finished calls [automated]"
          git pull --rebase --autostash -q
          git push
