name: Add generic emails to past batches

# One-off, free (no AI): reads each already-scraped institute's home/contact pages again and records its general
# inbox (info@, office@, international@ ...). See scripts/backfill_generic_email.py. Safe to run again: institutes
# already checked are skipped. Commits every 200 institutes, then rebuilds and re-sends each touched batch's Excel.
on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Only this batch (empty = all batches)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: backfill-generic-email

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Find the inboxes, committing every 200 institutes
        env:
          BATCH: ${{ github.event.inputs.batch }}
          BACKFILL_BATCHES_FILE: /tmp/batches_part.txt
        run: |
          git config user.name "paragon-scraper-bot"
          git config user.email "actions@users.noreply.github.com"
          : > /tmp/batches.txt
          for round in $(seq 1 20); do
            python scripts/backfill_generic_email.py --limit 200 --workers 12 ${BATCH:+--batch "$BATCH"} | tee /tmp/round.txt
            cat /tmp/batches_part.txt >> /tmp/batches.txt; echo >> /tmp/batches.txt
            git add data_hei
            git diff --cached --quiet || git commit -q -m "generic emails added to past results (round $round) [automated]"
            git pull --rebase --autostash -q && git push -q
            if grep -q "^0 institute(s) to check" /tmp/round.txt; then break; fi
          done
          sort -u /tmp/batches.txt | sed '/^$/d' > /tmp/touched.txt
          echo "Batches updated:"; cat /tmp/touched.txt

      - name: Rebuild each updated batch's Excel and send it to Google Drive
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          while read -r B; do
            [ -n "$B" ] || continue
            python scraper2/build_xlsx.py --batch "$B" &&
            { python scraper2/drive_upload.py --batch "$B" || echo "($B: Drive upload failed, non-fatal)"; }
            git add "data_hei/$B/progress.json"
            [ -f "data_hei/$B/results.xlsx" ] && git ls-files --error-unmatch "data_hei/$B/results.xlsx" >/dev/null 2>&1 && git add "data_hei/$B/results.xlsx"
          done < /tmp/touched.txt
          git diff --cached --quiet || git commit -q -m "generic emails: Excel files rebuilt [automated]"
          git pull --rebase --autostash -q && git push -q
