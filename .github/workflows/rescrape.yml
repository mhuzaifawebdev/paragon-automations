name: Rescrape failed dialer leads

# scripts/rescrape_leads.py: leads the dialer closed as unreachable / wrong_number go back to callers with a number
# not tried yet, or are queued (first in line) to be scraped again; queue_tick.py sends what that finds to the dialer.
# Started every hour in calling hours by apps_script/Scheduler.gs, by the "Rescrape failed leads now" button on the
# scraper page (event rescrape-now), and by the schedule below as a backup (GitHub runs it late or skips it).
#
# Secrets: DIALER_URL, DIALER_ADMIN_PASS, RESCRAPE_SECRET (same value as in the dialer's Vercel env), DISPATCH_TOKEN.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [rescrape-now]
  schedule:
    - cron: "15 7-16 * * *"

permissions:
  contents: write

concurrency:
  group: rescrape-leads
  cancel-in-progress: false

jobs:
  rescrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIALER_URL:        ${{ secrets.DIALER_URL }}
      DIALER_ADMIN_PASS: ${{ secrets.DIALER_ADMIN_PASS }}
      RESCRAPE_SECRET:   ${{ secrets.RESCRAPE_SECRET }}
      DISPATCH_TOKEN:    ${{ secrets.DISPATCH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rescrape failed leads
        run: python scripts/rescrape_leads.py
